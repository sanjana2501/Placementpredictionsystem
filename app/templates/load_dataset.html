{% extends "base.html" %}

{% block content %}

<div class="hero">

    <h2>Dataset Loaded Successfully</h2>

    <br>

    <h3>Dataset Summary</h3>

    <ul>

        <li>Total Rows : {{ summary.rows }}</li>

        <li>Total Columns : {{ summary.columns }}</li>

        <li>Target Column : {{ summary.target }}</li>

    </ul>

    <br>

    <h3>First Five Rows</h3>

    {{ first_rows|safe }}

</div>

{% endblock %}
